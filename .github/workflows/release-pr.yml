name: Release PR

on:
  push:
    branches: [ main, main-beta ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  node-version: 24.x

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    name: Release Please
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ github.ref == 'refs/heads/main' && 'release/main' || 'release/main-beta' }}

    steps:
      - name: Deep Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node v${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: ${{ env.node-version }}

      - name: Install NPM Dependencies
        run: npm ci

      - name: Check release group base tags
        shell: bash
        run: node scripts/check-release-tags.mjs --remote origin

      - name: Stable Version Bump (Nx)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: npm run release:stable

      - name: Beta Version Bump (Nx)
        if: ${{ github.ref != 'refs/heads/main' }}
        run: npm run release:beta

      - name: Bump root package version
        run: npm run version:root

      - name: Resolve public release summary
        id: summary
        shell: bash
        run: |
          node scripts/get-changed-release-projects.mjs > .changed-public-releases.json
          echo "json=$(tr -d '\n' < .changed-public-releases.json)" >> "$GITHUB_OUTPUT"
          echo "total=$(node -e \"process.stdout.write(String(JSON.parse(require('fs').readFileSync('.changed-public-releases.json', 'utf8')).total))\")" >> "$GITHUB_OUTPUT"
          echo "title=$(node -e \"process.stdout.write(JSON.parse(require('fs').readFileSync('.changed-public-releases.json', 'utf8')).title)\")" >> "$GITHUB_OUTPUT"
          echo "changelog-projects=$(node -e \"process.stdout.write(JSON.parse(require('fs').readFileSync('.changed-public-releases.json', 'utf8')).changelogProjects)\")" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('.changed-public-releases.json', 'utf8')).summary)"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        run: |
          echo "This is an automated Release PR for ${{ steps.summary.outputs.title }}." > PR_MESSAGE.tmp.md
          echo "" >> PR_MESSAGE.tmp.md
          echo "Public releases detected in this PR:" >> PR_MESSAGE.tmp.md
          echo "${{ steps.summary.outputs.summary }}" >> PR_MESSAGE.tmp.md
          if [ "${{ steps.summary.outputs.total }}" != "0" ]; then
            echo "" >> PR_MESSAGE.tmp.md
            npm run --silent get:changelog -- "${{ steps.summary.outputs.changelog-projects }}" >> PR_MESSAGE.tmp.md
          fi

      # Open a PR from release/main to main
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ env.TARGET_BRANCH }}
          title: "Auto Bump: ${{ env.TARGET_BRANCH }} → ${{ github.ref }} (${{ steps.summary.outputs.title }})"
          commit-message: 'chore: release ${{ steps.summary.outputs.title }}'
          body-path: "PR_MESSAGE.tmp.md"
          draft: true
          labels: "automated-pr"
          assignees: "ala-n, abarmina, NastaLeo"
