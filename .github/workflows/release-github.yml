name: Release Publisher (GitHub)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  node-version: 24.x

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve Release Groups
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
      total: ${{ steps.projects.outputs.total }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node v${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: ${{ env.node-version }}

      - name: Install NPM Dependencies
        run: npm ci

      - name: Resolve Release Group Matrix
        id: projects
        shell: bash
        run: |
          node scripts/get-public-release-projects.mjs > .release-groups.json
          echo "matrix=$(node -e \"const fs = require('fs'); const data = JSON.parse(fs.readFileSync('.release-groups.json', 'utf8')); process.stdout.write(JSON.stringify({include: data}));\")" >> "$GITHUB_OUTPUT"
          echo "total=$(node -e \"const fs = require('fs'); const data = JSON.parse(fs.readFileSync('.release-groups.json', 'utf8')); process.stdout.write(String(data.length));\")" >> "$GITHUB_OUTPUT"

  build:
    name: Build Tarballs
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.total != '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node v${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: ${{ env.node-version }}

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Tarballs
        run: npm run pack

      - name: Upload Tarballs
        uses: actions/upload-artifact@v7
        with:
          name: release-tarballs
          path: target/*.tgz
          if-no-files-found: error

  release:
    name: Release ${{ matrix.groupName }}
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.total != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node v${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: ${{ env.node-version }}

      - name: Install NPM Dependencies
        run: npm ci

      - name: Download Tarballs
        uses: actions/download-artifact@v8
        with:
          name: release-tarballs
          path: target

      - name: Check GitHub Release State
        id: state
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: '${{ matrix.releaseTag }}'
              });
              console.log('Release already exists for tag:', release.data.tag_name);
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              console.log('Release does not exist yet for tag: ${{ matrix.releaseTag }}');
              core.setOutput('exists', 'false');
            }

      - name: Build Release Notes
        if: ${{ steps.state.outputs.exists != 'true' }}
        run: npm run --silent get:changelog -- "${{ matrix.changelogProjects }}" > RELEASE_NOTES.md

      - name: Create GitHub Release
        if: ${{ steps.state.outputs.exists != 'true' }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ matrix.releaseTag }}
          tag: ${{ matrix.releaseTag }}
          commit: ${{ github.sha }}
          bodyFile: 'RELEASE_NOTES.md'
          artifacts: ${{ matrix.artifacts }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ matrix.isPrerelease }}
